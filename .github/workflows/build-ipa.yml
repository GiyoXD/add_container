name: Build iOS IPA (TrollStore / Jailbreak)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync with Capacitor iOS
        run: npx cap sync ios

      - name: Build Xcode Project (Unsigned)
        run: |
          cd ios/App
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          APP_DIR=$(find ios/App/build/Build/Products -name "App.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "Error: App.app not found!"
            exit 1
          fi
          echo "Found app at: $APP_DIR"
          cp -r "$APP_DIR" Payload/
          zip -r VisionLogistics-debug.ipa Payload
          rm -rf Payload

      - name: Upload Debug IPA
        uses: actions/upload-artifact@v4
        with:
          name: vision-logistics-debug-ipa
          path: VisionLogistics-debug.ipa
